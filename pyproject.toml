[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-mcp-server"
version = "1.0.0"
description = "Model Context Protocol (MCP) server for Jira Cloud and Data Center integration"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["mcp", "jira", "atlassian", "ai", "model-context-protocol", "antigravity", "claude", "cursor"]
authors = [
    { name = "Jira MCP Contributors" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = []

[project.scripts]
jira-mcp-server = "server:run_stdio_server"

[tool.setuptools]
py-modules = ["config", "jira_client", "server", "setup_config", "tools"]
